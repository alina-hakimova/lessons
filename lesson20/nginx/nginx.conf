events {
    worker_connections 1024;
}

http {
    upstream app1 {
        server 127.0.0.1:5001;  # Service-Py Docker (порт 5001)
    }

    upstream app2 {
        server 127.0.0.1:5002;  # Service-Go Docker (порт 5002)
    }

    upstream app3 {
        server 127.0.0.1:5000;  # Service-Py systemd (порт 5000)
    }

    upstream app4 {
        server 127.0.0.1:8080;  # Service-Go systemd (порт 8080)
    }

    server {
        listen 80;
        server_name _;

        # App1 - Service-Py (Docker)
        location /app1/ {
            proxy_pass http://app1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }

        # App2 - Service-Go (Docker)
        location /app2/ {
            proxy_pass http://app2/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }

        # App3 - Service-Py (systemd)
        location /app3/ {
            proxy_pass http://app3/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }

        # App4 - Service-Go (systemd)
        location /app4/ {
            proxy_pass http://app4/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }

        # Health check endpoint
        location /nginx-health {
            return 200 "nginx is healthy\n";
            add_header Content-Type text/plain;
        }
    }
}