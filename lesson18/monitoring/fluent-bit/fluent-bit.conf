[SERVICE]
    Flush        1
    Daemon       Off
    Log_Level    info
    Parsers_File parsers.conf

[INPUT]
    Name              tail
    Path              /var/log/app/*.log
    Parser            json
    Tag               flask.*
    Mem_Buf_Limit     5MB
    Skip_Long_Lines   On
    Refresh_Interval  10

[INPUT]
    Name              tail
    Path              /var/log/app/goapp.log
    Parser            json
    Tag               go.*
    Mem_Buf_Limit     5MB
    Skip_Long_Lines   On
    Refresh_Interval  10

[FILTER]
    Name              record_modifier
    Match             flask.*
    Record            hostname ${HOSTNAME}
    Record            service flask-app

[FILTER]
    Name              record_modifier
    Match             go.*
    Record            hostname ${HOSTNAME}
    Record            service go-app

[OUTPUT]
    Name              loki
    Match             *
    Url               http://loki:3100/loki/api/v1/push
    BatchWait         1
    BatchSize         102400
    Labels            {service="$service", level="$level", module="$module"}
    LineFormat        json
    LabelKeys         level,module,function,service
