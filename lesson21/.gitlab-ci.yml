        cd /home/user/dev/service_go;
        go build -o service-go;
        echo 'VERSION=dev-$CI_COMMIT_SHORT_SHA' > .env;
        sudo systemctl restart service-go-app4-dev
      "
  when: manual
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

