stages:
  - build
  - test
  - deploy

variables:
  DEPLOY_USER: "ubuntu"
  DEPLOY_SERVER: "192.168.225.128"
  DOCKER_PYTHON_APP: "docker.app.python.v1"
  DOCKER_GO_APP: "docker.app.go.v1" 
  SYSTEMD_PYTHON_APP: "systemd.app.python.v1"
  SYSTEMD_GO_APP: "systemd.app.go.v1"

workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^main|develop$/'
      when: always
    - if: '$CI_COMMIT_TAG'
      when: always
    - when: never

# 1. Python Docker приложение
build-python-docker:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  script:
    - export TAG="v1.${CI_PIPELINE_IID}"
    - docker build -t $DOCKER_PYTHON_APP:$TAG ./python
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"'

# 2. Go Docker приложение  
build-go-docker:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  script:
    - export TAG="v1.${CI_PIPELINE_IID}"
    - docker build -t $DOCKER_GO_APP:$TAG ./go
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"'

# 3. Python Systemd приложение
build-python-systemd:
  stage: build
  image: python:3.12
  script:
    - export TAG="v1.${CI_PIPELINE_IID}"
    - cd python
    - pip install -r requirements.txt
    - echo "app.v1 - Python Systemd Application" > version.txt
  artifacts:
    paths:
      - python/
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"'

# 4. Go Systemd приложение
build-go-systemd:
  stage: build
  image: golang:1.22
  script:
    - export TAG="v1.${CI_PIPELINE_IID}"
    - cd go
    - go build -ldflags="-X main.version=$TAG" -o app-go-$TAG
  artifacts:
    paths:
      - go/app-go-*
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"'

test-python:
  stage: test
  image: python:3.12
  script:
    - cd python
    - pip install -r requirements.txt
    - python -m pytest test_main.py -v
  rules:
    - if: '$CI_COMMIT_BRANCH || $CI_COMMIT_TAG'

test-go:
  stage: test
  image: golang:1.22
  script:
    - cd go
    - go test -v ./...
  rules:
    - if: '$CI_COMMIT_BRANCH || $CI_COMMIT_TAG'

# КНОПКА 1: Деплой Python Docker
deploy-python-docker:
  stage: deploy
  image: docker:24
  services:
    - docker:24-dind
  needs: ["build-python-docker"]
  script:
    - export TAG="v1.${CI_PIPELINE_IID}"
    - docker stop $DOCKER_PYTHON_APP || true
    - docker rm $DOCKER_PYTHON_APP || true
    - docker run -d --name $DOCKER_PYTHON_APP -p 8005:8000 $DOCKER_PYTHON_APP:$TAG
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual

# КНОПКА 2: Деплой Go Docker
deploy-go-docker:
  stage: deploy
  image: docker:24
  services:
    - docker:24-dind
  needs: ["build-go-docker"]
  script:
    - export TAG="v1.${CI_PIPELINE_IID}"
    - docker stop $DOCKER_GO_APP || true
    - docker rm $DOCKER_GO_APP || true
    - docker run -d --name $DOCKER_GO_APP -p 8010:8001 $DOCKER_GO_APP:$TAG
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual

# КНОПКА 3: Деплой Python Systemd
deploy-python-systemd:
  stage: deploy
  before_script:
    - 'which ssh-agent || ( apt-get update -y && apt-get install openssh-client rsync -y )'
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -H $DEPLOY_SERVER >> ~/.ssh/known_hosts
  script:
    - export TAG="v1.${CI_PIPELINE_IID}"
    - ./deploy-ssh.sh
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual

# КНОПКА 4: Деплой Go Systemd  
deploy-go-systemd:
  stage: deploy
  before_script:
    - 'which ssh-agent || ( apt-get update -y && apt-get install openssh-client -y )'
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -H $DEPLOY_SERVER >> ~/.ssh/known_hosts
  script:
    - export TAG="v1.${CI_PIPELINE_IID}"
    - cd go
    - go build -ldflags="-X main.version=$TAG" -o app-go-$TAG
    - scp app-go-$TAG $DEPLOY_USER@$DEPLOY_SERVER:/tmp/app-go-$TAG
    - ssh $DEPLOY_USER@$DEPLOY_SERVER "
        sudo cp /tmp/app-go-$TAG /usr/local/bin/app-go-current &&
        sudo chmod +x /usr/local/bin/app-go-current &&
        sudo systemctl stop $SYSTEMD_GO_APP || true &&
        sudo systemctl start $SYSTEMD_GO_APP &&
        echo '✅ Go Systemd app.v1 deployed successfully'
      "
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual