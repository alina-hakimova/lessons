
services:
  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5

  flask:
    build: ./app
    env_file:
      - .env
    ports:
      - "${FLASK_PORT}:${FLASK_PORT}"
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongo:
        condition: service_started

  pyworker:
    build: ./app
    command: python worker.py
    env_file:
      - .env
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongo:
        condition: service_started

  goapp:
    build: ./goapp
    env_file:
      - .env
    ports:
      - "${GO_PORT}:${GO_PORT}"
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongo:
        condition: service_started

  goworker:
    build: ./goapp
    command: ./goworker
    env_file:
      - .env
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongo:
        condition: service_started


  nginx:
    build: ./nginx
    ports:
      - "80:80"
    depends_on:
      - flask
      - goapp

volumes:
  mongodb_data:
